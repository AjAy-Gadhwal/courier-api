services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: courier_platform
      MYSQL_USER: courier
      MYSQL_PASSWORD: courier_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    env_file: ../.env
    environment:
      DB_HOST: mysql
    ports:
      - "3000:3000"

volumes:
  mysql_data:
